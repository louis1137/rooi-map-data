# 맵 로그 자료 수집 — 매일 PUBG 경기 기록을 모아 data 브랜치(GitHub Pages)의 자료 파일을 새로 만든다
#
#   main 브랜치   수집 코드 (원본은 PC 의 E:\작업프로그램\PUBG_MAP_LOG\tools\collect — 바꾸면 여기에 다시 올린다)
#   data 브랜치   store/matches/<지도>.ndjson (원본 기록, 지도마다 최근 2000경기) + data/*.json (맵 로그가 읽는 파일)
#                 GitHub Pages 로 공개 → https://louis1137.github.io/rooi-map-data/data/index.json
#                 매번 이력 없이 한 커밋으로 덮어쓴다 (저장소가 커지지 않게)
#   비공개로 두는 것  store/names.json (다음에 조회할 플레이어 닉네임) · store/skipped.txt → 공개 브랜치가 아니라 Actions 캐시에만 둔다
#
# 비용: PUBG 경기 정보 · 텔레메트리는 PUBG 서버에서 키 없이 바로 받는다. 플레이어 조회만 game-log-proxy 를 거친다 (한 번에 최대 60회).
#       공개 저장소의 Actions 는 무료.
name: 맵 로그 자료 수집

on:
  schedule:
    - cron: '13 20 * * *' # 매일 05:13 (한국 시각)
  workflow_dispatch:
    inputs:
      minutes:
        description: '수집 시간 (분)'
        default: '40'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: 수집 코드 (main)
        uses: actions/checkout@v4

      - name: 지난 자료 (data 브랜치)
        uses: actions/checkout@v4
        with:
          ref: data
          path: site

      - name: 조회 후보 닉네임 · 건너뛴 경기 (비공개 캐시)
        uses: actions/cache/restore@v4
        with:
          path: |
            site/store/names.json
            site/store/skipped.txt
          key: private-${{ github.run_id }}
          restore-keys: private-

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 수집 → 오래된 경기 빼기 → 자료 만들기
        env:
          MAP_LOG_STORE: ${{ github.workspace }}/site/store/
          MAP_LOG_DATA: ${{ github.workspace }}/site/data/
        run: node PUBG_MAP_LOG/tools/collect/collect.mjs --minutes ${{ inputs.minutes || '40' }}

      - name: 조회 후보 닉네임 · 건너뛴 경기 저장 (비공개 캐시)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            site/store/names.json
            site/store/skipped.txt
          key: private-${{ github.run_id }}

      - name: data 브랜치에 올리기 (한 커밋으로 덮어쓴다)
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan next
          git add -A
          git commit -q -m "자료 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f origin next:data
